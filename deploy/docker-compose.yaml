# Multi-tenant runtime + Postgres on one machine:
#   export AGENT_RUNTIME_TOKEN=$(openssl rand -hex 24) RUNTIME_SECRET_KEY=$(openssl rand -base64 32)
#   docker compose -f deploy/docker-compose.yaml up -d
services:
  agentd:
    build: ..
    ports: ["8080:8080"]
    environment:
      TENANCY_ENABLED: "true"
      DATABASE_URL: postgres://agentd:agentd@db:5432/agentd?sslmode=disable
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:?set AGENT_RUNTIME_TOKEN}
      RUNTIME_SECRET_KEY: ${RUNTIME_SECRET_KEY:?set RUNTIME_SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}           # e.g. http://host.docker.internal:11434 for a local Ollama
      TENANT_SHARED_LLM: ${TENANT_SHARED_LLM:-true} # tenants may use the LLM above
      GOMEMLIMIT: 200MiB
    extra_hosts: ["host.docker.internal:host-gateway"] # reach host services on Linux too
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentd
      POSTGRES_PASSWORD: agentd
      POSTGRES_DB: agentd
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agentd"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
