# Deploy manifest for ITDone Cloud (https://itdone.cloud). Copy it to the
# repository root of your fork to deploy with ITDone. Secrets:
#   AGENT_RUNTIME_TOKEN, RUNTIME_SECRET_KEY (openssl rand -base64 32),
#   LLM_API_KEY (optional shared provider)
# To let ITDone users log in with their ITDone token, also set:
#   EXTERNAL_AUTH_ENABLED=true
#   EXTERNAL_AUTH_USERINFO_URL=https://api.itdone.cloud/me
#   EXTERNAL_AUTH_ID_FIELD=id  EXTERNAL_AUTH_PLAN_FIELD=tier  EXTERNAL_AUTH_TENANT_PREFIX=itd-
version: "1"
services:
  agents:
    path: .
    port: 8080
    public: true
    env:
      TENANCY_ENABLED: "true"
      LLM_PROVIDER: mistral
      GOMEMLIMIT: 200MiB

addons:
  db:
    type: postgres
    attachTo:
      - agents
